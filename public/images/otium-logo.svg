<svg viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Otium — Swiss Ledger Seal">
  <!-- Permukaan kertas arsip & bingkai stempel Swiss -->
  <rect x="4" y="4" width="56" height="56" rx="5" fill="#FDFCFA" stroke="#1A3A2F" stroke-width="2.6" />
  <rect x="9.5" y="9.5" width="45" height="45" rx="2" stroke="#8F877A" stroke-opacity="0.45" stroke-width="1" />
  <!-- Monogram O geometris 270 derajat (negotium) -->
  <path
    d="M46.5 32C46.5 40.0081 40.0081 46.5 32 46.5C23.9919 46.5 17.5 40.0081 17.5 32C17.5 23.9919 23.9919 17.5 32 17.5"
    stroke="#1A3A2F"
    stroke-width="5.4"
    stroke-linecap="butt"
  />
  <!-- Kuadran istirahat & kuota cuti (otium) -->
  <rect x="35.5" y="15" width="13.5" height="13.5" rx="1.5" fill="#9A6B26" />
  <!-- Garis sumbu skala presisi di pusat -->
  <line x1="25" y1="32" x2="39" y2="32" stroke="#1A3A2F" stroke-width="2.2" />
  <line x1="32" y1="25" x2="32" y2="39" stroke="#1A3A2F" stroke-width="2.2" />
</svg>
